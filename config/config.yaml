# =============================================================================
# Organelle Annotation Pipeline - Configuration
# =============================================================================
# Supported tools:
#   Plastid/Chloroplast: chloe, pga
#   Mitochondrial:       mfannot, fpma, mitos, mitoz
#   Both/QC:             trnascan, aragorn, liftoff
#   Visualisation:       gbdraw
# =============================================================================

# -- Sample sheet (TSV) -------------------------------------------------------
samples: "config/samples.tsv"

# -- Run mode ------------------------------------------------------------------
#   "all"           : run all compatible tools per sample (based on organelle type)
#   "plastid"       : run only plastid tools (chloe, pga)
#   "mito"          : run only mitochondrial tools (mfannot, fpma, mitos, mitoz)
#   "select"        : run only tools listed in 'tools_select'
mode: "all"

# -- Tool selection ------------------------------------------------------------
# tools_select controls which annotation tools are active.
# ONLY tools listed here will be processed — comment out or remove a tool
# to disable it.  The "mode" setting above filters by organelle type, but
# the final tool list is always intersected with tools_select.
#
# ┌────────────┬────────────┬──────────────────────────────────────────────────────────────────┐
# │ Tool       │ Organelle  │ Description                                                      │
# ├────────────┼────────────┼──────────────────────────────────────────────────────────────────┤
# │ chloe      │ Plastid    │ Chloe.jl — Julia/XGBoost chloroplast annotator. Fast, accurate.  │
# │ pga        │ Plastid    │ PGA — Perl + BLAST batch plastid annotator. Detects IRs.         │
# │ mfannot    │ Mito       │ MFannot — Docker-based mito/plastid annotator (BLAST+HMMER).     │
# │ fpma       │ Mito       │ fpma — Rust + HMMER HMM scanner for plant mito gene presence.    │
# │ mitos      │ Mito       │ MITOS2 — Docker reference-based mito annotator (metazoa/fungi).  │
# │ mitoz      │ Mito       │ MitoZ — Docker animal mito annotator with circular visualisation.│
# │ trnascan   │ Both       │ tRNAscan-SE — gold-standard tRNA detection (covariance models).  │
# │ aragorn    │ Both       │ Aragorn — lightweight tRNA/tmRNA detection (fast, second-opinion)│
# │ liftoff    │ Both       │ Liftoff — minimap2-based annotation lift-over from a reference.  │
# └────────────┴────────────┴──────────────────────────────────────────────────────────────────┘
#
# To disable a tool, comment it out with "#" or remove the line entirely.
# Example: to run only mfannot and chloe, keep only those two uncommented.
tools_select:
  # ── Plastid / Chloroplast annotators ──
  - chloe        # Chloe.jl — Julia-based chloroplast annotator (XGBoost)
  - pga          # PGA — Plastid Genome Annotator (Perl + BLAST)
  # ── Mitochondrial annotators ──
  - mfannot      # MFannot — mitochondrial/plastid annotator (Docker)
  - fpma         # fpma — Fast Plant Mitochondria Annotator (Rust + HMMER)
  - mitos        # MITOS2 — mitochondrial genome annotator (Docker)
  - mitoz        # MitoZ — animal mitochondrial annotator (Docker)
  # ── Both / QC tools ──
  - trnascan     # tRNAscan-SE — tRNA gene detection (conda)
  - aragorn      # Aragorn — tRNA/tmRNA detection (conda)
  - liftoff      # Liftoff — reference-based annotation lift-over
  # ── Visualisation (auto-runs for tools that produce GenBank output) ──
  # - gbdraw     # gbdraw — circular genome map visualisation (conda)

# -- Quality control -----------------------------------------------------------
qc:
  enabled: true
  # BUSCO lineage dataset for chloroplast / mitochondrial gene completeness
  # Use "chloroplyta_odb10" for green-algae plastids, "embryophyta_odb10" for
  # land-plant nuclear, "eukaryota_odb10" as a general fallback, etc.
  # For organelle QC, we mainly check gene counts & completeness via custom summary.
  busco_lineage: "eukaryota_odb10"
  busco_mode: "genome"   # genome | proteins | transcriptome
  # Circular genome map (requires gbdraw; disabled by default)
  gbdraw: false

# -- Tool-specific settings ----------------------------------------------------

# Chloe.jl – chloroplast genome annotator (Julia)
chloe:
  # Path to the Chloe.jl directory (relative to pipeline root)
  path: "repo/Chloe.jl"
  # Reference set: "cp" (chloroplast) or "nr" (nuclear rDNA)
  reference: "cp"
  # Reference DB dir (clone from https://github.com/ian-small/chloe_references)
  references_dir: ""  # leave empty to use default bundled references
  # Output formats (at least one must be true)
  gff: true
  sff: false
  gbk: true
  embl: false
  # Sensitivity threshold (0.0 - 1.0; default 0.5)
  sensitivity: 0.5
  # Additional flags
  no_filter: false
  no_transform: false
  # Threads per job (Julia)
  threads: 4

# PGA – Plastid Genome Annotator (Perl + BLAST)
pga:
  # Path to PGA.pl (relative to pipeline root)
  path: "repo/PGA"
  # Reference GenBank directory (shipped with PGA)
  reference_dir: "repo/PGA/plastomes"
  # Genome topology: "circular" or "linear"
  form: "circular"
  # Minimum inverted repeat length (bp)
  ir_min: 1000
  # Min TBLASTN percent identity
  pidentity: 40
  # Query coverage range (min,max)
  qcoverage: "0.5,2"



# Liftoff – reference-based annotation lift-over (conda + minimap2)
# NOTE: reference_fasta and reference_gff are now per-sample in samples.tsv.
#       If empty for a sample, liftoff is automatically skipped.
liftoff:
  # Minimum coverage for feature mapping (0.0-1.0)
  min_coverage: 0.5
  # Minimum sequence identity (0.0-1.0)
  min_identity: 0.5
  # Extra flags
  extra: ""

# gbdraw – Genome diagram generator for organelles (conda: bioconda::gbdraw)
# Uses the Python API for comprehensive circular genome diagrams.
# See usage_gbdraw.md for full API reference.
gbdraw:
  # Output formats: svg, png, pdf, eps, ps
  # Multiple formats are produced per GenBank file.
  formats:
    - svg
    - png
  # Python API config overrides (passed to assemble_circular_diagram_from_record)
  #   strandedness : true  → separate forward/reverse strand tracks
  #   show_labels  : true  → display gene name labels on features
  # See usage_gbdraw.md §4 for all available options.
  config_overrides:
    strandedness: true
    show_labels: true

# MFannot – mitochondrial / plastid genome annotator (Docker)
mfannot:
  # Docker image
  docker_image: "nbeck/mfannot"
  # Genetic code
  #   1  = Standard
  #   2  = Vertebrate Mitochondrial
  #   3  = Yeast Mitochondrial
  #   4  = Mold, Protozoan, Coelenterate Mitochondrial
  #   5  = Invertebrate Mitochondrial
  #   11 = Bacterial/Plant Plastid
  genetic_code: 4
  # BLAST e-value cutoff
  blast_evalue: "1e-10"
  # Minimum ORF length (amino acids)
  min_orf_len: 40
  # Maximum intron size (nt)
  max_intron_size: 3000
  # Extra flags (appended as-is)
  extra: ""
  # Output Sequin format additionally
  sqn_format: false
  # Use Singularity/Apptainer instead of Docker
  use_singularity: true

# MITOS2 – Mitochondrial genome annotator (Docker)
mitos:
  # Docker image (from quay.io/biocontainers)
  docker_image: "quay.io/biocontainers/mitos:2.1.10--pyhdfd78af_0"
  # Reference database version used by MITOS
  #   "refseq63m" = MITOS1 RefSeq63 Metazoa (built-in)
  #   "refseq63f" = MITOS1 RefSeq63 Fungi
  #   "refseq63o" = MITOS1 RefSeq63 Opisthokonta
  #   "refseq89m" = MITOS2 RefSeq89 Metazoa
  #   "refseq89f" = MITOS2 RefSeq89 Fungi
  ref_db: "refseq63m"
  # Path to local reference DB directory (leave empty to use container built-in)
  ref_dir: ""
  # Use Singularity/Apptainer instead of Docker
  use_singularity: true
  # Extra flags (appended as-is to runmitos.py)
  extra: ""

# MitoZ – Animal Mitochondrial Genome Annotator (Docker)
mitoz:
  # Docker image (https://github.com/linzhi2013/MitoZ)
  docker_image: "guanliangmeng/mitoz:3.6"
  # Clade for annotation model:
  #   Chordata, Arthropoda, Echinodermata, Annelida-segmented-worms,
  #   Bryozoa, Mollusca, Nematoda, Nemertea-ribbon-worms, Porifera-sponges
  clade: "Chordata"
  # Use Singularity/Apptainer instead of Docker
  use_singularity: true
  # Extra flags (appended as-is)
  extra: ""

# tRNAscan-SE – tRNA gene detection (conda)
trnascan:
  # Search mode: "organelle" (= -O flag), "mammalian_mito", or "general"
  search_mode: "organelle"
  # Minimum bit score cutoff (default 20)
  score_cutoff: 20
  # Extra flags
  extra: ""

# Aragorn – tRNA / tmRNA detection (conda)
aragorn:
  # Genome topology: "circular" or "linear"
  topology: "circular"
  # Search both strands
  search_both_strands: true
  # Extra flags
  extra: ""

# fpma – Fast Plant Mitochondria Annotator (Rust + HMMER)
fpma:
  # Path to the fpma directory (contains compiled binary and hmms/)
  path: "repo/fpma"
  # Path to nhmmer executable (from HMMER3)
  nhmmer_path: "nhmmer"
  # HMM profile directory
  #   angiosperm_hmms, fern_hmms, gymnosperm_hmms,
  #   hornwort_hmms, liverwort_hmms, lycopod_hmms, moss_hmms
  hmms_subdir: "angiosperm_hmms"
  # E-value threshold
  e_value: 0.001
  # Generate HTML SVG plot
  plot: true

# -- Downstream analysis -------------------------------------------------------
# Post-annotation analyses: RSCU, codon usage, Ka/Ks, phylogeny, composition,
# genome map, and synteny. Set enabled: true to run.
downstream:
  enabled: true
  # Species name for NCBI reference fetching (genus or binomial)
  species_name: ""          # e.g. "Arabidopsis thaliana"
  # Email for NCBI Entrez (required by NCBI policy)
  email: ""                 # e.g. "user@example.com"
  # Reference genome settings
  max_ref_genomes: 10
  min_genome_length: 10000
  max_genome_length: 300000
  # Ka/Ks method: NG, LWL, YN, MYN, GY
  kaks_method: "NG"
  # Phylogeny: minimum shared genes for supermatrix
  phylo_min_genes: 4
  # IQ-TREE model and bootstrap replicates
  phylo_model: "GTR+G"
  phylo_bootstrap: 1000
  # Which downstream modules to run (all enabled by default)
  modules:
    - fetch_reference
    - rscu
    - codons
    - kaks
    - composition
    - phylogeny
    - genome_map
    - synteny

# -- Cluster / resource defaults -----------------------------------------------
resources:
  default:
    threads: 4
    mem_mb: 8000
    runtime: 120   # minutes
  chloe:
    threads: 4
    mem_mb: 8000
    runtime: 60
  pga:
    threads: 2
    mem_mb: 4000
    runtime: 60
  mfannot:
    threads: 4
    mem_mb: 8000
    runtime: 180
  fpma:
    threads: 2
    mem_mb: 4000
    runtime: 30
  mitos:
    threads: 4
    mem_mb: 8000
    runtime: 120
  mitoz:
    threads: 4
    mem_mb: 8000
    runtime: 180
  trnascan:
    threads: 4
    mem_mb: 4000
    runtime: 30
  aragorn:
    threads: 1
    mem_mb: 2000
    runtime: 15

  liftoff:
    threads: 4
    mem_mb: 4000
    runtime: 30
  gbdraw:
    threads: 1
    mem_mb: 2000
    runtime: 15
  busco:
    threads: 8
    mem_mb: 16000
    runtime: 120
  downstream:
    threads: 4
    mem_mb: 8000
    runtime: 180
