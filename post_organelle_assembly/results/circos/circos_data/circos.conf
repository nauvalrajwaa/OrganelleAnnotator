# Circos configuration – mitochondrial genome map
karyotype = karyotype.txt

<<include ideogram.conf>>
<<include ticks.conf>>

chromosomes_units = 1
chromosomes_display_default = yes

# ---- image settings ---
<image>
<<include etc/image.conf>>
dir*    = .
file*   = circos.png
radius* = 1500p
</image>

# ================================================================
# HIGHLIGHTS – gene tracks (coloured tiles)
# ================================================================
<highlights>

# Forward-strand genes (outer ring)
<highlight>
file   = genes_forward.txt
r0     = 0.88r
r1     = 0.95r
</highlight>

# Reverse-strand genes (next ring inwards)
<highlight>
file   = genes_reverse.txt
r0     = 0.80r
r1     = 0.87r
</highlight>

</highlights>

# ================================================================
# PLOTS – histograms for GC content & GC skew, plus gene labels
# ================================================================
<plots>

# -- Gene labels --
<plot>
type       = text
file       = gene_labels.txt
color      = black
r0         = 0.95r
r1         = 1.15r
label_size = 18p
label_font = condensed
label_parallel = yes

<rules>
<rule>
condition  = 1
label_size = 16p
</rule>
</rules>
</plot>

# -- GC content (deviation from mean) --
<plot>
type       = histogram
file       = gc_content.txt
r0         = 0.60r
r1         = 0.78r
min        = -0.15
max        = 0.15
color      = black
fill_under = yes
fill_color = blue
thickness  = 1

<backgrounds>
<background>
color = vvlgrey
</background>
</backgrounds>

<axes>
<axis>
color     = lgrey
thickness = 1
spacing   = 0.05r
</axis>
</axes>

<rules>
<rule>
condition  = var(value) < 0
fill_color = orange
</rule>
</rules>
</plot>

# -- GC skew (G-C)/(G+C) --
<plot>
type       = histogram
file       = gc_skew.txt
r0         = 0.40r
r1         = 0.58r
min        = -0.30
max        = 0.30
color      = black
fill_under = yes
fill_color = dgreen
thickness  = 1

<backgrounds>
<background>
color = vvlgrey
</background>
</backgrounds>

<axes>
<axis>
color     = lgrey
thickness = 1
spacing   = 0.05r
</axis>
</axes>

<rules>
<rule>
condition  = var(value) < 0
fill_color = purple
</rule>
</rules>
</plot>

</plots>

<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>
