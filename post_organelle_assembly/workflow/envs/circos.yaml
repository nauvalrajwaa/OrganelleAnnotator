## NOTE: circos and its Perl deps are only available for osx-64.
## On Apple Silicon run snakemake with:
##   CONDA_SUBDIR=osx-64 snakemake --use-conda ...
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - biopython
  - circos=0.69.9
  - perl=5.32.1
  - perl-gd
  - perl-gdgraph
  - perl-config-general
  - perl-font-ttf
  - perl-readonly
  - perl-text-format
  - perl-statistics-basic
  - perl-math-vecstat
  - perl-math-bezier
  - perl-math-round
  - perl-svg
  - perl-set-intspan
  - perl-clone
  - perl-list-moreutils
  - perl-params-validate
  - perl-number-format
  - perl-regexp-common
